<!DOCTYPE html>
<html>
<head>
    <title>Manage Questions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container mt-5">

    <h1 class="mb-4">Manage Questions</h1>

    <a href="/admin/questions/add" class="btn btn-success mb-3">Add Question</a>

    <table class="table table-dark table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Category</th>
                <th>Question</th>
                <th>Answer</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
        {% for question in questions %}
            <tr>
                <td>{{ question.id }}</td>
                <td>{{ question.category }}</td>
                <td>{{ question.question }}</td>
                <td>{{ question.correct_answer }}</td>
                <td>
                    <a href="/admin/questions/edit/{{ question.id }}" class="btn btn-warning btn-sm">
                        Edit
                    </a>

                    <form action="/admin/questions/delete/{{ question.id }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>
