{% extends 'base.html' %}
{% block title %}Register — CyberQuest{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-lg p-4 mt-4">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus-fill" style="font-size: 3rem; color: #FFD700;"></i>
        <h2 class="mt-2" style="color: #FFD700;">Create Your Account</h2>
        <p style="color: #FFFFFF;">Join CyberQuest and start your cybersecurity journey</p>
      </div>
      <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" name="username"
                 value="{{ username or '' }}" placeholder="Choose a username" minlength="3" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control" id="email" name="email"
                 value="{{ email or '' }}" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label for="role" class="form-label">I am a...</label>
          <select class="form-select" id="role" name="role">
            <option value="student" {% if role == 'student' %}selected{% endif %}>🎓 Student</option>
            <option value="teacher" {% if role == 'teacher' %}selected{% endif %}>👨‍🏫 Teacher</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="At least 8 characters" minlength="8" required>
        </div>
        <div class="mb-3">
          <label for="confirm_password" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirm_password"
                 name="confirm_password" placeholder="Repeat your password" required>
        </div>
        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-gold btn-lg">
            <i class="bi bi-person-check me-2"></i>Create Account
          </button>
        </div>
      </form>
      <hr>
      <p class="text-center mb-0" style="color: #FFFFFF;">
        Already have an account?
        <a href="{{ url_for('auth.login') }}" style="color: #FFD700; font-weight: 700;">Login here</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
