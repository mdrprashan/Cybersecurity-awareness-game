<!DOCTYPE html>
<html>
<head>
    <title>CyberQuest Challenges</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center mb-4">CyberQuest Challenges</h1>

    <div class="row">
        {% for category in categories %}
        <div class="col-md-4">
            <div class="card shadow p-3 mb-4">
                <div class="card-body text-center">
                    <h4>{{ category }}</h4>
                    <p>Complete cybersecurity quiz challenges.</p>
                    <a href="{{ url_for('game.challenge_category', category=category) }}" class="btn btn-primary">
                        Start Challenge
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="text-center mt-4">
        <a href="{{ url_for('game.progress') }}" class="btn btn-success">View Progress</a>
    </div>
</div>

</body>
</html>
