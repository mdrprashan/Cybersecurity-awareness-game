{% extends 'base.html' %}
{% block title %}Logged Out — CyberQuest{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-box-arrow-right" style="font-size: 3rem; color: #FFD700;"></i>
  <h2 class="mt-3" style="color: #FFD700;">You have been logged out</h2>
  <p style="color: #FFFFFF;">Redirecting to home page...</p>
</div>
{% endblock %}
{% block extra_js %}
<script>
  // Force full page reload to clear any cached navbar state
  setTimeout(function() {
    window.location.replace("{{ url_for('index') }}");
  }, 500);
</script>
{% endblock %}
