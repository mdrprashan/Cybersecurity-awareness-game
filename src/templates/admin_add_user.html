{% extends "base.html" %}
{% block title %}Add User — CyberQuest Admin{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <a href="{{ url_for('admin.dashboard') }}" class="btn btn-cq-outline btn-sm mb-4">← Dashboard</a>
      <div class="card-cq p-4">
        <h4 style="color:var(--cq-cyan);" class="mb-4">➕ Add New User</h4>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" required class="form-control"
                   style="background:var(--cq-navy-light);border:1px solid var(--cq-border);color:var(--cq-text);border-radius:8px;">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" required class="form-control"
                   style="background:var(--cq-navy-light);border:1px solid var(--cq-border);color:var(--cq-text);border-radius:8px;">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Role</label>
            <select name="role" class="form-select"
                    style="background:var(--cq-navy-light);border:1px solid var(--cq-border);color:var(--cq-text);border-radius:8px;">
              <option value="student">🎓 Student</option>
              <option value="teacher">👨‍🏫 Teacher</option>
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Temporary Password</label>
            <input type="text" name="password" value="{{ temp_pw }}" required minlength="8" class="form-control"
                   style="background:var(--cq-navy-light);border:1px solid var(--cq-border);color:var(--cq-text);border-radius:8px;">
            <div class="form-text" style="color:var(--cq-text-muted);">Share this with the user. They should change it after first login.</div>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-cq-primary btn-lg">Create User</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
