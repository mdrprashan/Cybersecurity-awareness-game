<!DOCTYPE html>
<html>
<head>
    <title>CyberQuest Question</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-5">

    {% if challenge %}

    <div class="card shadow p-4">

        <h3 class="mb-4">{{ challenge.question }}</h3>

        <form method="POST" action="{{ url_for('game.answer', challenge_id=challenge.id) }}">

            <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="answer" value="a" required>
                <label class="form-check-label">
                    {{ challenge.option_a }}
                </label>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="answer" value="b">
                <label class="form-check-label">
                    {{ challenge.option_b }}
                </label>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="answer" value="c">
                <label class="form-check-label">
                    {{ challenge.option_c }}
                </label>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="radio" name="answer" value="d">
                <label class="form-check-label">
                    {{ challenge.option_d }}
                </label>
            </div>

            <button type="submit" class="btn btn-primary">
                Submit Answer
            </button>

        </form>

    </div>

    {% else %}

    <h2>{{ category }}</h2>

    <div class="list-group">

        {% for question in questions %}

        <a href="{{ url_for('game.question', challenge_id=question.id) }}"
           class="list-group-item list-group-item-action">

            {{ question.question }}

            {% if question.id in answered_ids %}
                <span class="badge bg-success float-end">Completed</span>
            {% endif %}

        </a>

        {% endfor %}

    </div>

    {% endif %}

</div>

</body>
</html>
