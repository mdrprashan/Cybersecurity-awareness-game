{% extends 'base.html' %}
{% block title %}{{ title }} — CyberQuest{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-tools" style="font-size: 4rem; color: #FFD700;"></i>
  <h2 class="mt-4" style="color: #FFD700;">{{ title }}</h2>
  <p class="lead mt-3" style="color: #FFFFFF;">{{ message }}</p>
  <div class="mt-4">
    {% if current_user.role == 'teacher' %}
      <a href="{{ url_for('admin.dashboard') }}" class="btn btn-gold btn-lg">
        <i class="bi bi-speedometer2 me-2"></i>Go to Dashboard
      </a>
    {% else %}
      <a href="{{ url_for('index') }}" class="btn btn-gold btn-lg">
        <i class="bi bi-house me-2"></i>Go to Home
      </a>
    {% endif %}
  </div>
</div>
{% endblock %}
